name: Zoho Nightly Sync

on:
  # Manual trigger from the Actions tab
  workflow_dispatch:

  # Nightly at 07:00 UTC = 02:00 CT (Lake Saint Louis time, standard)
  # Adjust the cron if you want a different time.
  schedule:
    - cron: "0 7 * * *"

# Allow the workflow to push commits back to the repo
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # detail-fetching every invoice can take a while

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID: ${{ secrets.ZOHO_ORG_ID }}
        run: python sync_zoho.py

      - name: Commit updated data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data.js; then
            echo "No changes to data.js — skipping commit."
            exit 0
          fi

          # Strip the timestamp comment line so trivial reruns don't always commit.
          # We only commit if the actual data changed beyond the header.
          DIFF_BODY=$(git diff -- data.js | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE 'auto-generated by sync_zoho.py' | head -5)
          if [ -z "$DIFF_BODY" ]; then
            echo "Only timestamp header changed — skipping commit."
            git checkout -- data.js
            exit 0
          fi

          git add data.js
          git commit -m "chore: nightly Zoho sync $(date -u +%Y-%m-%d)"
          git push

