name: Zoho Full Rebuild (manual only)

# Manual trigger only — this job takes 2+ hours for 60k invoices.
# Run it monthly (or whenever) from the Actions tab when you want a
# full reconcile to catch deleted invoices or cumulative edit drift.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zoho-sync
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours — 20k invoices takes ~2-3h

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run full rebuild
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID: ${{ secrets.ZOHO_ORG_ID }}
        run: python sync_full.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.js last_sync.json

          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi

          git commit -m "chore: full rebuild $(date -u +%Y-%m-%d)"
          git push
