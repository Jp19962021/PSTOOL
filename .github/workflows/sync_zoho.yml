name: Nightly Zoho Invoice Sync
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Full sync from 2024? (yes/no)'
        required: false
        default: 'no'
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      # - name: Force sync from April 25
      # run: python -c "import json; f=open('last_sync.json','w'); json.dump({'completed_at':'2026-04-16T00:00:00Z'},f); f.close()"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Zoho sync
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID: '691451730'
          FULL_SYNC: ${{ github.event.inputs.full_sync == 'yes' && '1' || '0' }}
        run: python sync_zoho.py
      - name: Commit updated data.js
        run: |
          git config user.name "PSTOOL Sync Bot"
          git config user.email "sync-bot@pstool"
          git add data.js
          git diff --cached --quiet || git commit -m "data: nightly Zoho sync $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
