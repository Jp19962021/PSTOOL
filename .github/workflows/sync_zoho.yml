name: Nightly Zoho Invoice Sync

on:
  schedule:
    - cron: '0 7 * * *'   # 2am US Central (7am UTC)
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit data.js back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Zoho sync
        env:
          ZOHO_CLIENT_ID:     ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID:        '691451730'
        run: python sync_zoho.py

      - name: Commit updated data.js
        run: |
          git config user.name  "PSTOOL Sync Bot"
          git config user.email "sync-bot@pstool"
          git add data.js
          # Only commit if data.js actually changed
          git diff --cached --quiet || git commit -m "data: nightly Zoho sync $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
